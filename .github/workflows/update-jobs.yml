name: Daily Job Crawler

on:
  schedule:
    # Runs daily at 01:30 AM UTC (07:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Job Scraper
        run: |
          npm run scrape

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update government and local job listings" && git push)
